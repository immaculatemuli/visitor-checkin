# Set the site's base directory to "client" in Netlify; paths below are relative to it.
[build]
  command = "npm run build"
  publish = "dist"

# Proxy the API through this domain so session cookies are first-party (Safari blocks third-party cookies).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
